:root{
 --grund:#2e3133; --umgebung:#1f2224; --tinte:#f2f4f4; --sek:#d2d5d6; --ruhig:#bcbfc0;
 --mB:#a5a9aa; --mC:#929698; --rStark:#878c8e; --rMittel:#5f6467; --rLeise:#43474a; --faint:#6e7274;
 --schrift:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark;
}
html,body{background:var(--grund);color:var(--tinte)}
body{font-family:var(--schrift);font-weight:400;-webkit-font-smoothing:antialiased;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.blatt{max-width:520px;margin:0 auto}
.zahl,.betrag,input{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.k{display:block;font:400 10px/1 var(--schrift);letter-spacing:.3em;text-transform:uppercase;color:var(--mB)}
.m{display:block;font:400 10px/1.4 var(--schrift);letter-spacing:.24em;text-transform:uppercase;color:var(--mC)}

/* Kopf */
.kopf{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0 18px;border-bottom:1px solid var(--rStark)}
.kopf b{font:500 13px/1 var(--schrift);letter-spacing:.32em;text-transform:uppercase}
.kopf .m{text-align:right}

/* Die eine Zahl */
.heute{padding:34px 0 30px;border-bottom:1px solid var(--rMittel)}
.heute .zahl{display:block;font:200 clamp(64px,22vw,104px)/1 var(--schrift);letter-spacing:-.01em;margin:20px 0 18px;white-space:nowrap}
.heute .zahl small{font-size:.32em;font-weight:400;letter-spacing:.2em;margin-left:.4em;color:var(--mC)}

/* Band */
.band{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rStark)}
.band>span{padding:20px 0 22px;min-width:0}
.band>span+span{padding-left:14px;border-left:1px solid var(--rLeise)}
.band .v{display:block;font:200 30px/1 var(--schrift);margin:14px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Eingabe */
form{padding:26px 0 24px;border-bottom:1px solid var(--rStark);display:grid;gap:14px}
.art{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rMittel)}
.art button{appearance:none;background:none;border:0;color:var(--mC);padding:13px 0;font:400 11px/1 var(--schrift);letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
.art button+button{border-left:1px solid var(--rMittel)}
.art button[aria-pressed="true"]{background:var(--tinte);color:var(--umgebung);font-weight:500}
.zeile{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
label{display:grid;gap:8px;min-width:0}
input{appearance:none;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid var(--rStark);border-radius:0;color:var(--tinte);font:200 40px/1.1 var(--schrift);padding:4px 0 8px;outline:none}
input::placeholder{color:var(--faint)}
input:focus{border-bottom-color:var(--tinte)}
input.klein{font:400 16px/1.2 var(--schrift);padding:6px 0 8px}
input[type=date]{font:400 14px/1.2 var(--schrift);letter-spacing:.06em;color:var(--sek)}
.los{appearance:none;background:var(--tinte);color:var(--umgebung);border:0;padding:16px 22px;font:500 11px/1 var(--schrift);letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
.los:disabled{background:var(--rLeise);color:var(--faint)}
button:focus-visible,input:focus-visible{outline:1px solid var(--tinte);outline-offset:3px}
.unten{display:grid;grid-template-columns:1fr 128px;gap:12px}

/* Monat */
.monat{padding-top:26px}
.monat h2{all:unset;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid var(--rMittel)}
.tag{display:flex;justify-content:space-between;padding:18px 0 8px;border-bottom:1px solid var(--rLeise)}
.tag .betrag{font:400 10px/1 var(--schrift);letter-spacing:.2em;color:var(--mC)}
.pos{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rLeise);cursor:pointer}
.pos .t{color:var(--ruhig);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pos .t.leer{color:var(--faint)}
.pos .betrag{font:400 18px/1 var(--schrift);color:var(--sek)}
.pos.ein .betrag{color:var(--tinte);font-weight:500}
.weg{display:flex;gap:10px;grid-column:1/-1;justify-content:flex-end;padding-top:6px}
.weg button{appearance:none;border:1px solid var(--rMittel);background:none;color:var(--sek);padding:10px 14px;font:400 10px/1 var(--schrift);letter-spacing:.26em;text-transform:uppercase;cursor:pointer}
.weg button.ja{background:var(--tinte);color:var(--umgebung);border-color:var(--tinte);font-weight:500}
.leerstand{padding:28px 0;color:var(--mC);font-size:15px;line-height:1.5}

/* Budget */
.fuss{margin-top:34px;padding-top:18px;border-top:1px solid var(--rStark);display:grid;gap:14px}
.fuss .zeile{grid-template-columns:1fr auto}
#budget{font-size:28px}
.fussbtn{appearance:none;background:none;border:1px solid var(--rMittel);color:var(--sek);padding:12px 16px;font:400 10px/1 var(--schrift);letter-spacing:.26em;text-transform:uppercase;cursor:pointer}
.hinweis{font-size:13px;line-height:1.5;color:var(--mC);margin:0}
.hinweis:empty{display:none}
.unten2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fussbtn{justify-self:start}
@media (max-width:360px){.band .v{font-size:24px}}
[hidden]{display:none!important}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>

<div class="blatt">
 <header class="kopf"><b>Tagesgeld</b><span class="m" id="kopfMonat"></span></header>

 <section class="heute" aria-live="polite">
  <span class="k" id="heuteK">Heute noch</span>
  <span class="zahl" id="heuteV">—<small>CHF</small></span>
  <span class="m" id="heuteM">Budget unten festlegen</span>
 </section>

 <div class="band">
  <span><span class="k">Ab morgen</span><span class="v zahl" id="morgenV">—</span><span class="m">pro Tag</span></span>
  <span><span class="k">Rest</span><span class="v zahl" id="restV">—</span><span class="m" id="restM">bis Lohn</span></span>
  <span><span class="k">Tage</span><span class="v zahl" id="tageV">—</span><span class="m">bis Lohn</span></span>
 </div>

 <form id="eingabe" autocomplete="off">
  <div class="art" role="group" aria-label="Art">
   <button type="button" id="artAus" aria-pressed="true">Ausgabe</button>
   <button type="button" id="artEin" aria-pressed="false">Einnahme</button>
  </div>
  <label><span class="k">Betrag CHF</span><input id="betrag" inputmode="decimal" placeholder="0.00"></label>
  <label><span class="k">Wofür</span><input id="notiz" class="klein" placeholder="Migros, Kaffee, Twint …" maxlength="60"></label>
  <div class="unten">
   <label><span class="k">Tag</span><input id="datum" type="date" class="klein"></label>
   <button class="los" id="los" disabled>Buchen</button>
  </div>
 </form>

 <section class="monat">
  <h2><span class="k" id="monatK">Seit Lohn</span><span class="m zahl" id="monatSumme"></span></h2>
  <div id="liste"><p class="leerstand">Noch nichts gebucht seit dem Lohn. Betrag oben eingeben und «Buchen» tippen.</p></div>
 </section>

 <footer class="fuss">
  <label><span class="k">Budget von Lohn zu Lohn, CHF</span>
   <input id="budget" inputmode="decimal" placeholder="z. B. 900">
  </label>
  <div class="unten2">
   <label><span class="k">Lohn erhalten am</span><input id="lohnVon" type="date" class="klein"></label>
   <label><span class="k">Nächster Lohn am</span><input id="lohnBis" type="date" class="klein"></label>
  </div>
  <p class="hinweis" id="lohnHinweis"></p>
  <button type="button" class="fussbtn" id="budgetLos">Sichern</button>
  <p class="hinweis" id="ablage"></p>
 </footer>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad=n=>String(n).padStart(2,'0');
const isoTag=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

// Rappen rein, Schweizer Schreibweise raus: 1'234.50, Minus als echtes Minuszeichen.
// Ganze Franken werden kaufmännisch gerundet (ab 50 Rappen auf), nicht abgeschnitten.
function chf(r,ganz){
  const a=Math.abs(Math.round(r)), f=ganz?Math.round(a/100):Math.floor(a/100);
  let s=String(f).replace(/\B(?=(\d{3})+(?!\d))/g,"'");
  if(!ganz) s+='.'+pad(a%100);
  return (r<0&&(f||!ganz&&a)?'−':'')+s;  // kein «−0», wenn die Rundung auf null fällt
}
function rappen(txt){
  const t=String(txt||'').replace(/['\s]/g,'').replace(',','.');
  if(!/^\d+(\.\d{0,2})?$/.test(t)) return null;
  const r=Math.round(parseFloat(t)*100);
  return r>0?r:null;
}

// ---- Zustand ----
const S={budget:null,stichtage:[],buchungen:[],typ:'aus',offen:null};
let jetzt=new Date();
const MK=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const kurz=iso=>{const [j,m,d]=iso.split('-').map(Number);return d+'. '+MK[m-1]};
const plusMonat=(iso,k)=>{const [j,m,d]=iso.split('-').map(Number);const x=new Date(j,m-1+k,1);
  const max=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d,max));return isoTag(x)};
const tageZw=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);

// Periode: vom letzten Lohntag bis zum Tag vor dem nächsten. Fehlt eine Seite, wird sie
// einen Monat weg geschätzt; fehlen beide, gilt der Kalendermonat.
function periode(){
  const t=isoTag(jetzt), st=[...new Set(S.stichtage)].sort();
  let von=null,bis=null;
  for(const s of st){if(s<=t)von=s;else if(!bis)bis=s}
  const vonGeschaetzt=!von&&!!bis, bisGeschaetzt=!!von&&!bis;
  if(!von&&!bis){von=t.slice(0,8)+'01';bis=plusMonat(von,1);return {von,bis,kalender:true}}
  if(!von)von=plusMonat(bis,-1);
  if(!bis)bis=plusMonat(von,1);
  return {von,bis,vonGeschaetzt,bisGeschaetzt};
}
let P=periode();

// ---- Ablage: db, sonst nur dieses Gerät ----
const LS='tagesgeld.v1';
let ablage=null;
function lokal(){
  let d={budget:null,stichtage:[],buchungen:[]};
  try{d=Object.assign(d,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
  const schreib=()=>{try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}};
  const lade=()=>{S.budget=d.budget;S.stichtage=d.stichtage||[];P=periode();
    S.buchungen=d.buchungen.filter(b=>b.datum>=P.von);zeichne()};
  lade();
  ablage={
    async speichern(b){b.id='l'+Date.now();d.buchungen.push(b);schreib();lade()},
    async loeschen(id){d.buchungen=d.buchungen.filter(b=>b.id!==id);schreib();lade()},
    async einstellen(e){Object.assign(d,e);schreib();lade()},
    neuePeriode(){lade()}
  };
  $('ablage').textContent='Gespeichert nur auf diesem Handy. Browserdaten löschen löscht auch die Buchungen.';
}
function fehler(e){$('ablage').textContent='Ablage nicht erreichbar ('+(e&&e.code||'unbekannt')+'). Seite neu laden.'}

// ---- Rechnung ----
function rechne(){
  const t=isoTag(jetzt);
  const tage=tageZw(t,P.bis);                          // heute bis Vortag des Lohns
  let vorher=0, heute=0, ein=0, aus=0;
  const drin=S.buchungen.filter(b=>b.datum>=P.von&&b.datum<P.bis);
  // Einnahmen gehören der ganzen Periode, egal an welchem Tag gebucht: sie erhöhen den Topf
  // und verteilen sich sofort auf alle verbleibenden Tage, nie nur auf den Buchungstag.
  for(const b of drin){
    if(b.typ==='ein'){ein+=b.betrag;continue}
    aus+=b.betrag;
    if(b.datum<t)vorher-=b.betrag;else heute-=b.betrag; // Künftige Ausgaben zählen wie heute: schon verplant
  }
  if(S.budget==null) return {tage,ein,aus,drin};
  const start=S.budget+ein+vorher, tagesbudget=start/tage, rest=start+heute;
  return {tage,ein,aus,drin,tagesbudget,heuteNoch:tagesbudget+heute,rest,morgen:tage>1?rest/(tage-1):null};
}

// ---- Zeichnen ----
function zeichne(){
  const letzter=plusMonat(P.bis,0), ende=isoTag(new Date(new Date(P.bis+'T12:00')-864e5));
  $('kopfMonat').textContent=kurz(P.von)+' – '+kurz(ende);
  $('monatK').textContent=P.kalender?'Seit '+kurz(P.von):'Seit Lohn '+kurz(P.von);
  const r=rechne();
  $('tageV').textContent=r.tage;
  if(r.tagesbudget==null){
    $('heuteK').textContent='Heute noch';
    $('heuteV').innerHTML='—<small>CHF</small>';
    $('heuteM').textContent='Budget unten festlegen';
    $('morgenV').textContent='—';$('restV').textContent='—';
  }else{
    const ueber=r.heuteNoch<0;
    $('heuteK').textContent=ueber?'Heute überzogen':'Heute noch';
    $('heuteV').innerHTML=chf(r.heuteNoch)+'<small>CHF</small>';
    $('heuteM').textContent='Von '+chf(r.tagesbudget)+' Tagesbudget';
    $('morgenV').textContent=r.morgen==null?'—':chf(r.morgen,true);
    $('restV').textContent=chf(r.rest,true);
  }
  const fokus=document.activeElement;
  if(fokus!==$('budget')) $('budget').value=S.budget==null?'':(S.budget/100).toFixed(S.budget%100?2:0);
  if(fokus!==$('lohnVon')) $('lohnVon').value=P.kalender||P.vonGeschaetzt?'':P.von;
  if(fokus!==$('lohnBis')) $('lohnBis').value=P.kalender||P.bisGeschaetzt?'':P.bis;
  $('lohnHinweis').textContent=
    P.kalender?'Ohne Lohntage rechnet die Seite im Kalendermonat.':
    P.bisGeschaetzt?'Nächster Lohntag fehlt. Gerechnet wird bis '+kurz(P.bis)+', einen Monat nach dem letzten Lohn. Trag das echte Datum ein, sobald du es kennst.':
    P.vonGeschaetzt?'Letzter Lohntag fehlt. Gezählt wird ab '+kurz(P.von)+', einen Monat vor dem nächsten Lohn.':'';
  $('monatSumme').textContent=r.drin.length?('− '+chf(r.aus,true)+'  ·  + '+chf(r.ein,true)):'';
  liste(r.drin);
}
function liste(drin){
  const l=$('liste');
  if(!drin.length){l.innerHTML='<p class="leerstand">Noch nichts gebucht seit dem Lohn. Betrag oben eingeben und «Buchen» tippen.</p>';return}
  const nachTag={};
  for(const b of drin)(nachTag[b.datum]=nachTag[b.datum]||[]).push(b);
  const frag=document.createDocumentFragment();
  for(const tag of Object.keys(nachTag).sort().reverse()){
    const bs=nachTag[tag].sort((a,b)=>(b.t||0)-(a.t||0));
    const d=new Date(tag+'T12:00'), sum=bs.reduce((s,b)=>s+(b.typ==='ein'?b.betrag:-b.betrag),0);
    const h=document.createElement('div');h.className='tag';
    const kk=document.createElement('span');kk.className='k';
    kk.textContent=tag===isoTag(jetzt)?'Heute':WT[d.getDay()]+' '+kurz(tag);
    const ss=document.createElement('span');ss.className='betrag';ss.textContent=(sum>0?'+':'')+chf(sum);
    h.append(kk,ss);frag.append(h);
    for(const b of bs){
      const p=document.createElement('div');p.className='pos'+(b.typ==='ein'?' ein':'');p.tabIndex=0;
      const t=document.createElement('span');t.className='t'+(b.notiz?'':' leer');t.textContent=b.notiz||(b.typ==='ein'?'Einnahme':'Ausgabe');
      const v=document.createElement('span');v.className='betrag';v.textContent=(b.typ==='ein'?'+':'−')+chf(b.betrag);
      p.append(t,v);
      if(S.offen===b.id){
        const w=document.createElement('div');w.className='weg';
        const nein=document.createElement('button');nein.textContent='Behalten';nein.onclick=e=>{e.stopPropagation();S.offen=null;zeichne()};
        const ja=document.createElement('button');ja.className='ja';ja.textContent='Löschen';
        ja.onclick=async e=>{e.stopPropagation();S.offen=null;try{await ablage.loeschen(b.id)}catch(x){fehler(x)}};
        w.append(nein,ja);p.append(w);
      }
      const auf=()=>{S.offen=S.offen===b.id?null:b.id;zeichne()};
      p.onclick=auf;p.onkeydown=e=>{if(e.key==='Enter'&&e.target===p)auf()};
      frag.append(p);
    }
  }
  l.replaceChildren(frag);
}

// ---- Eingabe ----
function setzeTyp(t){S.typ=t;$('artAus').setAttribute('aria-pressed',t==='aus');$('artEin').setAttribute('aria-pressed',t==='ein')}
$('artAus').onclick=()=>setzeTyp('aus');$('artEin').onclick=()=>setzeTyp('ein');
$('datum').value=isoTag(jetzt);
$('betrag').oninput=()=>{$('los').disabled=rappen($('betrag').value)==null};
$('eingabe').onsubmit=async e=>{
  e.preventDefault();
  const r=rappen($('betrag').value);if(r==null||!ablage)return;
  const datum=$('datum').value||isoTag(jetzt);
  const b={art:'buchung',typ:S.typ,betrag:r,datum,monat:datum.slice(0,7),notiz:$('notiz').value.trim(),t:Date.now()};
  $('los').disabled=true;
  try{await ablage.speichern(b);$('betrag').value='';$('notiz').value='';setzeTyp('aus');$('betrag').blur()}
  catch(x){fehler(x);$('los').disabled=false}
};
// Sichern: Budget und die beiden Lohntage. Ersetzt werden nur die Lohntage der laufenden
// Periode; ältere bleiben stehen, damit vergangene Perioden später nachvollziehbar sind.
$('budgetLos').onclick=async()=>{
  if(!ablage)return;
  const txt=$('budget').value.trim(), r=txt?rappen(txt):null;
  if(txt&&r==null){$('lohnHinweis').textContent='Budget als Zahl eingeben, z. B. 900 oder 900.50.';return}
  const von=$('lohnVon').value, bis=$('lohnBis').value;
  if(von&&bis&&bis<=von){$('lohnHinweis').textContent='Der nächste Lohn muss nach dem letzten liegen.';return}
  let st=S.stichtage.filter(s=>s!==P.von&&s!==P.bis);
  if(von)st.push(von);if(bis)st.push(bis);
  st=[...new Set(st)].sort().slice(-36);
  document.activeElement.blur();
  try{await ablage.einstellen({budget:r??S.budget,stichtage:st})}catch(x){fehler(x)}
};

// Mitternacht und Lohntag bei offener Seite abfangen
setInterval(()=>{
  const n=new Date();
  if(isoTag(n)!==isoTag(jetzt)){
    jetzt=n;P=periode();
    if($('datum').value<isoTag(n))$('datum').value=isoTag(n);
    ablage&&ablage.neuePeriode();
    zeichne();
  }
},30000);

zeichne();
lokal();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

</body>
